<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Use Case и Sequence Diagrams</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f7fa;
            padding: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .slide {
            background: white;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1, h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        h2 {
            border-left: 4px solid #3498db;
            padding-left: 15px;
        }
        svg {
            width: 100%;
            height: auto;
        }
        .actor {
            fill: #f39c12;
            stroke: #e67e22;
            stroke-width: 2;
        }
        .actor-head {
            fill: #f39c12;
            stroke: #e67e22;
            stroke-width: 2;
        }
        .usecase {
            fill: #e3f2fd;
            stroke: #3498db;
            stroke-width: 2;
        }
        .system-box {
            fill: none;
            stroke: #2c3e50;
            stroke-width: 2;
            stroke-dasharray: 5,5;
        }
        .lifeline {
            stroke: #7f8c8d;
            stroke-width: 1;
            stroke-dasharray: 5,5;
        }
        .object-box {
            fill: #3498db;
            stroke: #2980b9;
            stroke-width: 2;
        }
        .object-text {
            fill: white;
            font-size: 12px;
            font-weight: bold;
            text-anchor: middle;
        }
        .message-line {
            stroke: #2c3e50;
            stroke-width: 1.5;
            marker-end: url(#arrow);
        }
        .message-text {
            fill: #2c3e50;
            font-size: 11px;
        }
        .activation {
            fill: #e3f2fd;
            stroke: #3498db;
            stroke-width: 1;
        }
        .return-line {
            stroke: #27ae60;
            stroke-width: 1.5;
            stroke-dasharray: 5,5;
            marker-end: url(#arrow-green);
        }
        .return-text {
            fill: #27ae60;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align:center">📋 Диаграммы использования и взаимодействия</h1>

        <!-- Use Case Diagram -->
        <div class="slide">
            <h2>Use Case Diagram (Диаграмма прецедентов)</h2>
            <svg viewBox="0 0 900 500">
                <defs>
                    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
                    </marker>
                    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
                    </marker>
                </defs>

                <!-- System boundary -->
                <rect x="200" y="50" width="600" height="400" class="system-box" rx="10"/>
                <text x="500" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Hotel Management System</text>

                <!-- Actors -->
                <!-- Admin -->
                <circle cx="80" cy="120" r="15" class="actor-head"/>
                <line x1="80" y1="135" x2="80" y2="180" stroke="#e67e22" stroke-width="2"/>
                <line x1="55" y1="155" x2="105" y2="155" stroke="#e67e22" stroke-width="2"/>
                <line x1="80" y1="180" x2="55" y2="210" stroke="#e67e22" stroke-width="2"/>
                <line x1="80" y1="180" x2="105" y2="210" stroke="#e67e22" stroke-width="2"/>
                <text x="80" y="230" text-anchor="middle" font-size="13" font-weight="bold">Администратор</text>

                <!-- Manager -->
                <circle cx="80" cy="280" r="15" class="actor-head"/>
                <line x1="80" y1="295" x2="80" y2="340" stroke="#e67e22" stroke-width="2"/>
                <line x1="55" y1="315" x2="105" y2="315" stroke="#e67e22" stroke-width="2"/>
                <line x1="80" y1="340" x2="55" y2="370" stroke="#e67e22" stroke-width="2"/>
                <line x1="80" y1="340" x2="105" y2="370" stroke="#e67e22" stroke-width="2"/>
                <text x="80" y="390" text-anchor="middle" font-size="13" font-weight="bold">Менеджер</text>

                <!-- Accountant -->
                <circle cx="80" cy="420" r="15" class="actor-head"/>
                <line x1="80" y1="435" x2="80" y2="480" stroke="#e67e22" stroke-width="2"/>
                <line x1="55" y1="455" x2="105" y2="455" stroke="#e67e22" stroke-width="2"/>
                <line x1="80" y1="480" x2="55" y2="510" stroke="#e67e22" stroke-width="2"/>
                <line x1="80" y1="480" x2="105" y2="510" stroke="#e67e22" stroke-width="2"/>
                <text x="80" y="530" text-anchor="middle" font-size="13" font-weight="bold">Бухгалтер</text>

                <!-- Use Cases -->
                <ellipse cx="350" cy="120" rx="70" ry="25" class="usecase"/>
                <text x="350" y="125" text-anchor="middle" font-size="11">Управление номерами</text>

                <ellipse cx="350" cy="200" rx="70" ry="25" class="usecase"/>
                <text x="350" y="205" text-anchor="middle" font-size="11">Управление сотрудниками</text>

                <ellipse cx="350" cy="280" rx="70" ry="25" class="usecase"/>
                <text x="350" y="285" text-anchor="middle" font-size="11">Управление клиентами</text>

                <ellipse cx="500" cy="160" rx="70" ry="25" class="usecase"/>
                <text x="500" y="165" text-anchor="middle" font-size="11">Создание бронирования</text>

                <ellipse cx="500" cy="240" rx="70" ry="25" class="usecase"/>
                <text x="500" y="245" text-anchor="middle" font-size="11">Регистрация услуг</text>

                <ellipse cx="500" cy="320" rx="70" ry="25" class="usecase"/>
                <text x="500" y="325" text-anchor="middle" font-size="11">Расчёт себестоимости</text>

                <ellipse cx="650" cy="120" rx="70" ry="25" class="usecase"/>
                <text x="650" y="125" text-anchor="middle" font-size="11">Ввод расходов</text>

                <ellipse cx="650" cy="200" rx="70" ry="25" class="usecase"/>
                <text x="650" y="205" text-anchor="middle" font-size="11">Выплата зарплат</text>

                <ellipse cx="650" cy="280" rx="70" ry="25" class="usecase"/>
                <text x="650" y="285" text-anchor="middle" font-size="11">Финансовые отчёты</text>

                <ellipse cx="650" cy="360" rx="70" ry="25" class="usecase"/>
                <text x="650" y="365" text-anchor="middle" font-size="11">Прогнозирование</text>

                <ellipse cx="500" cy="400" rx="70" ry="25" class="usecase"/>
                <text x="500" y="405" text-anchor="middle" font-size="11">Экспорт в Excel</text>

                <!-- Connections -->
                <line x1="105" y1="120" x2="280" y2="120" stroke="#7f8c8d" stroke-width="1"/>
                <line x1="105" y1="120" x2="280" y2="200" stroke="#7f8c8d" stroke-width="1"/>
                <line x1="105" y1="280" x2="280" y2="280" stroke="#7f8c8d" stroke-width="1"/>
                <line x1="105" y1="280" x2="430" y2="160" stroke="#7f8c8d" stroke-width="1"/>
                <line x1="105" y1="280" x2="430" y2="240" stroke="#7f8c8d" stroke-width="1"/>
                <line x1="105" y1="280" x2="430" y2="320" stroke="#7f8c8d" stroke-width="1"/>
                <line x1="105" y1="420" x2="580" y2="120" stroke="#7f8c8d" stroke-width="1"/>
                <line x1="105" y1="420" x2="580" y2="200" stroke="#7f8c8d" stroke-width="1"/>
                <line x1="105" y1="420" x2="580" y2="280" stroke="#7f8c8d" stroke-width="1"/>
                <line x1="105" y1="420" x2="580" y2="360" stroke="#7f8c8d" stroke-width="1"/>
                <line x1="105" y1="420" x2="430" y2="400" stroke="#7f8c8d" stroke-width="1"/>
            </svg>
        </div>

        <!-- Sequence Diagram -->
        <div class="slide">
            <h2>Sequence Diagram (Диаграмма последовательности)</h2>
            <p style="margin-bottom: 20px; color: #7f8c8d;">Алгоритм расчёта себестоимости номера при открытии справочника</p>
            
            <svg viewBox="0 0 900 500">
                <defs>
                    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
                    </marker>
                    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
                    </marker>
                </defs>

                <!-- Objects -->
                <rect x="50" y="20" width="120" height="40" class="object-box" rx="5"/>
                <text x="110" y="45" class="object-text">Пользователь</text>
                
                <rect x="250" y="20" width="120" height="40" class="object-box" rx="5" style="fill:#9b59b6"/>
                <text x="310" y="45" class="object-text">RoomsView</text>
                
                <rect x="450" y="20" width="140" height="40" class="object-box" rx="5" style="fill:#e74c3c"/>
                <text x="520" y="45" class="object-text">RoomService</text>
                
                <rect x="650" y="20" width="180" height="40" class="object-box" rx="5" style="fill:#f39c12"/>
                <text x="740" y="45" class="object-text">RoomCostCalculation</text>

                <!-- Lifelines -->
                <line x1="110" y1="60" x2="110" y2="480" class="lifeline"/>
                <line x1="310" y1="60" x2="310" y2="480" class="lifeline"/>
                <line x1="520" y1="60" x2="520" y2="480" class="lifeline"/>
                <line x1="740" y1="60" x2="740" y2="480" class="lifeline"/>

                <!-- Messages -->
                <!-- 1 -->
                <line x1="110" y1="90" x2="310" y2="90" class="message-line"/>
                <text x="210" y="85" text-anchor="middle" class="message-text">1. Открыть "Номера"</text>

                <!-- 2 -->
                <rect x="300" y="100" width="20" height="40" class="activation"/>
                <line x1="310" y1="110" x2="520" y2="110" class="message-line"/>
                <text x="415" y="105" text-anchor="middle" class="message-text">2. GetAllRoomsAsync()</text>

                <!-- 3 -->
                <rect x="510" y="120" width="20" height="100" class="activation"/>
                <line x1="520" y1="130" x2="740" y2="130" class="message-line"/>
                <text x="630" y="125" text-anchor="middle" class="message-text">3. CalculateRoomCostAsync(room)</text>

                <!-- 4 -->
                <rect x="730" y="140" width="20" height="60" class="activation"/>
                <line x1="740" y1="150" x2="740" y2="170" class="message-line" style="marker-end:none"/>
                <text x="750" y="165" class="message-text">4. Получить Expenses + ЗП</text>

                <line x1="740" y1="180" x2="740" y2="200" class="message-line" style="marker-end:none"/>
                <text x="750" y="195" class="message-text">5. Получить все Rooms</text>

                <!-- Return -->
                <line x1="740" y1="210" x2="520" y2="210" class="return-line"/>
                <text x="630" y="225" text-anchor="middle" class="return-text">← Return: cost (10 Br)</text>

                <!-- 6 -->
                <line x1="520" y1="230" x2="310" y2="230" class="return-line"/>
                <text x="415" y="245" text-anchor="middle" class="return-text">← Return: List&lt;Room&gt; с Cost</text>

                <!-- 7 -->
                <line x1="310" y1="260" x2="110" y2="260" class="return-line"/>
                <text x="210" y="275" text-anchor="middle" class="return-text">← Отображение таблицы</text>

                <!-- Formula box -->
                <rect x="580" y="300" width="280" height="120" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="8"/>
                <text x="720" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Формула внутри сервиса:</text>
                <text x="600" y="350" font-size="11" fill="#856404" font-family="monospace">totalExpenses = ΣExpenses + ΣSalaries</text>
                <text x="600" y="370" font-size="11" fill="#856404" font-family="monospace">totalArea = ΣRoom.Area</text>
                <text x="600" y="390" font-size="11" fill="#856404" font-family="monospace">costPerSqm = totalExpenses / totalArea</text>
                <text x="600" y="410" font-size="11" fill="#856404" font-family="monospace">dailyCost = costPerSqm × area / (30×0.8)</text>
            </svg>
        </div>

        <!-- Algorithm flow -->
        <div class="slide">
            <h2>Блок-схема алгоритма прогнозирования</h2>
            <svg viewBox="0 0 800 500">
                <!-- Start -->
                <rect x="320" y="20" width="160" height="40" rx="20" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
                <text x="400" y="45" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Начало</text>
                
                <line x1="400" y1="60" x2="400" y2="80" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

                <!-- Input -->
                <rect x="250" y="80" width="300" height="50" rx="5" fill="#e3f2fd" stroke="#3498db" stroke-width="2"/>
                <text x="400" y="100" text-anchor="middle" font-size="12">Получить исторические данные (12 мес.)</text>
                <text x="400" y="118" text-anchor="middle" font-size="11" fill="#7f8c8d">Бронирования, транзакции, расходы</text>

                <line x1="400" y1="130" x2="400" y2="150" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

                <!-- Process 1 -->
                <rect x="250" y="150" width="300" height="50" rx="5" fill="#fff3cd" stroke="#f39c12" stroke-width="2"/>
                <text x="400" y="170" text-anchor="middle" font-size="12">Рассчитать сезонные коэффициенты</text>
                <text x="400" y="188" text-anchor="middle" font-size="11" fill="#7f8c8d">Каждый месяц = bookings / среднее</text>

                <line x1="400" y1="200" x2="400" y2="220" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

                <!-- Process 2 -->
                <rect x="250" y="220" width="300" height="50" rx="5" fill="#fff3cd" stroke="#f39c12" stroke-width="2"/>
                <text x="400" y="240" text-anchor="middle" font-size="12">Рассчитать коэффициенты дней недели</text>
                <text x="400" y="258" text-anchor="middle" font-size="11" fill="#7f8c8d">Пн, Вт, Ср, Чт, Пт, Сб, Вс</text>

                <line x1="400" y1="270" x2="400" y2="290" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

                <!-- Process 3 -->
                <rect x="250" y="290" width="300" height="50" rx="5" fill="#fff3cd" stroke="#f39c12" stroke-width="2"/>
                <text x="400" y="310" text-anchor="middle" font-size="12">Определить тренд</text>
                <text x="400" y="328" text-anchor="middle" font-size="11" fill="#7f8c8d">(Последний мес − Первый) / Первый × 100%</text>

                <line x1="400" y1="340" x2="400" y2="360" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

                <!-- Decision -->
                <polygon points="400,360 480,390 400,420 320,390" fill="#fce4ec" stroke="#e91e63" stroke-width="2"/>
                <text x="400" y="385" text-anchor="middle" font-size="11">Для каждого дня</text>
                <text x="400" y="400" text-anchor="middle" font-size="11">прогнозного периода</text>

                <line x1="400" y1="420" x2="400" y2="440" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

                <!-- Formula -->
                <rect x="200" y="440" width="400" height="45" rx="5" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
                <text x="400" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">Прогноз = Среднее × Сезон × День_недели × Тренд</text>
                <text x="400" y="478" text-anchor="middle" font-size="11" fill="#2e7d32">±20% диапазон</text>
            </svg>
        </div>
    </div>
</body>
</html>
